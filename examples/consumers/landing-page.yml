# Copy to: <landing-page repo>/.github/workflows/ci.yml
# Assumes a static site built with Node and served by an nginx-based Dockerfile.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: your-org/ci-blueprints/.github/workflows/node-ci.yml@v1
    with:
      node-version: "22"
      test-command: ""   # skip tests if the landing page has none

  image:
    needs: ci
    permissions:
      contents: read
      packages: write
    uses: your-org/ci-blueprints/.github/workflows/docker-publish.yml@v1
    with:
      image-name: your-org/landing
      push: ${{ github.event_name == 'push' }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    uses: your-org/ci-blueprints/.github/workflows/deploy.yml@v1
    with:
      service: landing
      image-tag: ${{ needs.image.outputs.image-tag }}
      environment: production
    secrets: inherit
